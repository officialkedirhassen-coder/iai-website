<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769d2">
  <meta name="description" content="Islamic AI — Knowledge Without Borders">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Islamic AI | IAI</title>
  <style>
    :root{font-family:Arial,system-ui,sans-serif;color:#17243a;background:#f5f8fc}
    *{box-sizing:border-box} body{margin:0;min-height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px max(5%,calc((100% - 1050px)/2));background:#fff;border-bottom:1px solid #e7edf5}
    .brand{display:flex;gap:11px;align-items:center}.brand img{width:42px;height:42px}
    .brand strong{display:block;font-size:19px;color:#155bb5}.brand small{color:#68788e}
    button,select{font:inherit} select{border:1px solid #d8e1ed;border-radius:10px;padding:9px;background:white}
    main{max-width:850px;margin:65px auto;padding:0 20px;text-align:center}
    h1{font-size:clamp(30px,6vw,46px);margin:12px 0;color:#142b4b}
    .tagline{color:#61738b;font-size:17px;margin:0 0 34px}
    .panel{background:#fff;border:1px solid #e4ebf4;border-radius:20px;padding:22px;box-shadow:0 12px 35px #18365a0b}
    textarea{width:100%;min-height:115px;resize:vertical;border:1px solid #dbe4ef;border-radius:13px;padding:15px;font:16px/1.5 inherit;outline-color:#2475dc}
    .actions{display:flex;justify-content:flex-end;margin-top:12px}
    .primary{background:#1769d2;color:#fff;border:0;border-radius:11px;padding:12px 22px;font-weight:700;cursor:pointer}
    .primary:active{transform:translateY(1px)}
    #response{display:none;text-align:left;margin-top:18px;padding:15px;border-radius:12px;background:#eef5ff;color:#18385f;line-height:1.55}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:22px}
    .card{background:#fff;border:1px solid #e4ebf4;border-radius:14px;padding:17px;color:#34506f}
    .card b{display:block;color:#1d5eae;margin-bottom:6px}
    footer{margin:35px 0;color:#8996a8;font-size:13px}
    @media(max-width:600px){main{margin:38px auto}.cards{grid-template-columns:1fr}.panel{padding:15px}header{padding:14px 18px}}
  </style>
</head>
<body>
<header>
  <div class="brand"><img src="icon.svg" alt="IAI crescent logo"><div><strong>Islamic AI</strong><small>Knowledge Without Borders</small></div></div>
  <select id="language" aria-label="Language"><option value="en">English</option><option value="am">አማርኛ</option></select>
</header>
<main>
  <h1 id="title">Ask Islamic AI</h1>
  <p class="tagline" id="tagline">Knowledge Without Borders</p>
  <section class="panel">
    <textarea id="question" placeholder="Ask your question..." aria-label="Your question"></textarea>
    <div class="actions"><button class="primary" id="ask">Ask IAI</button></div>
    <div id="response" role="status" aria-live="polite"></div>
  </section>
  <section class="cards">
    <div class="card"><b id="c1">AI Chat</b><span id="d1">Ask general questions</span></div>
    <div class="card"><b id="c2">Islamic Knowledge</b><span id="d2">Qur’an, Hadith and learning</span></div>
    <div class="card"><b id="c3">Languages</b><span id="d3">Learn and communicate</span></div>
  </section>
  <footer id="footer">Prototype version 0.3 · AI connection is not enabled yet.</footer>
</main>
<script>
(function(){
 const $ = id => document.getElementById(id);
 const copy = {
  en:{title:"Ask Islamic AI",tagline:"Knowledge Without Borders",placeholder:"Ask your question...",ask:"Ask IAI",empty:"Please write a question first.",demo:"Thank you for trying Islamic AI! This is the prototype interface. The real AI answer service has not been connected yet.",c1:"AI Chat",d1:"Ask general questions",c2:"Islamic Knowledge",d2:"Qur’an, Hadith and learning",c3:"Languages",d3:"Learn and communicate",footer:"Prototype version 0.3 · AI connection is not enabled yet."},
  am:{title:"ኢስላሚክ AIን ይጠይቁ",tagline:"እውቀት ያለ ድንበር",placeholder:"ጥያቄዎን እዚህ ይጻፉ...",ask:"IAIን ጠይቅ",empty:"እባክዎ መጀመሪያ ጥያቄ ይጻፉ።",demo:"Islamic AIን ስለተጠቀሙ እናመሰግናለን! ይህ የመጀመሪያ ሙከራ ስሪት ነው። እውነተኛው የAI መልስ አገልግሎት ገና አልተገናኘም።",c1:"AI ውይይት",d1:"አጠቃላይ ጥያቄዎችን ይጠይቁ",c2:"ኢስላማዊ እውቀት",d2:"ቁርአን፣ ሐዲስ እና ትምህርት",c3:"ቋንቋዎች",d3:"ይማሩ እና ይገናኙ",footer:"የሙከራ ስሪት 0.3 · የAI ግንኙነት ገና አልተነቃም።"}
 };
 function setLanguage(lang){
  const t=copy[lang]||copy.en;
  document.documentElement.lang=lang;
  ["title","tagline","ask","c1","d1","c2","d2","c3","d3","footer"].forEach(k=>$(k).textContent=t[k]);
  $("question").placeholder=t.placeholder;
  $("response").style.display="none";
 }
 $("language").addEventListener("change",e=>setLanguage(e.target.value));
 $("ask").addEventListener("click",()=>{
  const lang=$("language").value, t=copy[lang]||copy.en;
  $("response").textContent=$("question").value.trim()?t.demo:t.empty;
  $("response").style.display="block";
 });
 $("question").addEventListener("keydown",e=>{if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) $("ask").click();});
 if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
 }
 setLanguage("en");
})();
</script>
</body>
</html>
